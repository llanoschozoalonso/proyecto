</br>

     


   <!-- INICIO: CODIGO PARA LOGRAR QUE AL DAR CLICK EN UNA DE LAS OPCIONES SE PINTE DE NEGRO  --> 
    <script>
        // Seleccionamos todas las etiquetas con clase "opcion"
        const opciones = document.querySelectorAll(".opcion");
        opciones.forEach(opcion => {
        opcion.addEventListener("click", () => {
            // Quitamos la clase "activo" de todas
            opciones.forEach(o => o.classList.remove("activo"));
            // Agregamos la clase "activo" solo a la que se clicó
            opcion.classList.add("activo");
        });
        });
    </script>
    <!-- FIN: CODIGO PARA LOGRAR QUE AL DAR CLICK EN UNA DE LAS OPCIONES SE PINTE DE NEGRO  -->
